<ion-content>
  <app-page-shell
    eyebrow="Staff access"
    title="Welcome back"
    description="Sign in to continue to your authorized Peniel workspace."
  >
    <app-card class="login-card">
      <div class="login-brand" aria-label="Peniel staff access">
        <img src="assets/peniel-mark.svg" alt="" />
        <span>Peniel</span>
      </div>
      <form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <app-form-field label="Email address" [error]="emailError" [required]="true">
          <ion-input
            formControlName="email"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
            fill="outline"
            aria-label="Email address"
          />
        </app-form-field>

        <app-form-field label="Password" [error]="passwordError" [required]="true">
          <div class="password-control">
            <ion-input
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password"
              fill="outline"
              aria-label="Password"
            />
            <button
              class="password-toggle"
              type="button"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              (click)="togglePasswordVisibility()"
            >
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" aria-hidden="true" />
            </button>
          </div>
        </app-form-field>
        @if (errorMessage) {
          <app-feedback-state kind="error" [message]="errorMessage" [title]="'Sign-in unsuccessful'" />
        }
        <app-button type="submit" expand="block" [disabled]="form.invalid" [loading]="submitting">Sign in</app-button>
      </form>
    </app-card>
  </app-page-shell>
</ion-content>
