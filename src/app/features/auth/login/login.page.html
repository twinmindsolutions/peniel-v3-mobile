<ion-content>
  <app-page-shell>
    <div class="login-layout">
      <div class="login-brand" aria-label="Peniel staff access">
        <img src="assets/peniel-mark.svg" alt="" />
        <div>
          <span class="brand-name">Peniel</span>
          <span class="brand-subtitle">Church Management</span>
        </div>
      </div>
      <p class="login-eyebrow">WELCOME BACK</p>
      <h1>Sign in to your workspace</h1>

      <form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <app-form-field label="Email address" [error]="emailError" [required]="true">
          <ion-input
            formControlName="email"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
            fill="outline"
            aria-label="Email address"
          />
        </app-form-field>

        <app-form-field label="Password" [error]="passwordError" [required]="true" [hasTrailingControl]="true">
          <ion-input
            field-input
            formControlName="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            fill="outline"
            aria-label="Password"
          />
          <button
            field-suffix
            class="password-toggle"
            type="button"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            (click)="togglePasswordVisibility()"
          >
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" aria-hidden="true" />
          </button>
        </app-form-field>
        @if (errorMessage) {
          <app-feedback-state kind="error" [message]="errorMessage" [title]="'Sign-in unsuccessful'" />
        }
        <app-button type="submit" variant="navy" expand="block" [disabled]="form.invalid" [loading]="submitting">Sign in</app-button>
      </form>

      <footer class="login-footer">
        <ion-icon name="shield-checkmark-outline" aria-hidden="true" />
        <span>Secure access to your church workspace</span>
      </footer>
    </div>
  </app-page-shell>
</ion-content>
