<ion-header><ion-toolbar><ion-title>Account security</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding"><main class="security-page"><p>Change the password for your Peniel account.</p><form [formGroup]="form" (ngSubmit)="submit()"><ion-item><ion-label position="stacked">Current password</ion-label><ion-input type="password" formControlName="currentPassword" autocomplete="current-password" /></ion-item><ion-item><ion-label position="stacked">New password</ion-label><ion-input type="password" formControlName="newPassword" autocomplete="new-password" /></ion-item><ion-item><ion-label position="stacked">Confirm new password</ion-label><ion-input type="password" formControlName="passwordConfirmation" autocomplete="new-password" /></ion-item>@if (error) { <p class="error" role="alert">{{ error }}</p> } @if (message) { <p class="success" role="status">{{ message }}</p> }<ion-button type="submit" expand="block" [disabled]="submitting">{{ submitting ? 'Changing password...' : 'Change password' }}</ion-button></form></main></ion-content>
