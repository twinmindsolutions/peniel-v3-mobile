<ion-content [fullscreen]="true">
  <main class="welcome-page">
    <div class="welcome-backdrop" aria-hidden="true"></div>
    <div class="welcome-content">
      <div class="brand-lockup" aria-label="Peniel">
        <img src="assets/peniel-mark.svg" alt="" />
        <span>Peniel</span>
      </div>
      <div class="welcome-copy">
        <p class="eyebrow">Church administration, together</p>
        <h1>Building stronger churches together.</h1>
        <p>Tools for attendance, members, and church life.</p>
      </div>
      <app-button expand="block" (click)="getStarted()">Get started</app-button>
    </div>
  </main>
</ion-content>
